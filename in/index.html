<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>in | Ayush Raj</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <img src="../img/portrait.png" alt="" />
        <a class="brand" href="../index.html">Ayush Raj</a>
        <nav>
          <a href="../index.html">home</a>
          <span class="sep">|</span>
          <a href="../blog/">blog</a>
          <span class="sep">|</span>
          <a href="../work.html">work</a>
        </nav>
        <div class="end">
          <a href="https://linkedin.com/in/ayushraj10">linkedin</a>
        </div>
      </header>

      <div class="page article">
        <h1 class="post">Hello</h1>
        <p id="status">Recording this visit…</p>
        <p>
          Opening this page counts as a click. If the link had your name on it,
          that name is counted too. You can also leave a name below.
        </p>
        <form id="checkin">
          <label for="who">Name (optional)</label>
          <input id="who" name="who" type="text" maxlength="32" autocomplete="name" />
          <button type="submit">Check in</button>
        </form>
        <p class="sub" id="note"></p>
        <p><a href="../blog/what-should-we-maximize-for-in-our-20s.html">Read the essay</a></p>
        <p class="footer"><a href="../index.html">Ayush Raj</a></p>
      </div>
    </div>
    <script>
      (function () {
        var NS = "ayushraj-co-in";
        var params = new URLSearchParams(location.search);
        var from = (params.get("from") || "").trim().toLowerCase();
        if (!/^[a-z0-9_-]{2,32}$/.test(from)) from = "";

        var status = document.getElementById("status");
        var note = document.getElementById("note");
        var input = document.getElementById("who");
        if (from) input.value = from;

        function bump(key) {
          return fetch(
            "https://abacus.jasoncameron.dev/hit/" + NS + "/" + encodeURIComponent(key)
          ).then(function (r) {
            return r.json();
          });
        }

        function ping(who) {
          return fetch("https://formsubmit.co/ajax/iamayushraj10@gmail.com", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              _subject: "ayushraj.co.in/in click",
              who: who || "(anonymous)",
              link: location.href,
              time: new Date().toISOString(),
            }),
          });
        }

        var seen = sessionStorage.getItem("in-hit");
        var jobs = [];
        if (!seen) {
          jobs.push(bump("invite"));
          if (from) jobs.push(bump("from-" + from));
          jobs.push(ping(from).catch(function () {}));
          sessionStorage.setItem("in-hit", "1");
        }

        Promise.all(jobs)
          .then(function () {
            status.textContent = from
              ? "Recorded a visit as " + from + "."
              : "Recorded a visit.";
          })
          .catch(function () {
            status.textContent = "Could not record this visit. The page still works.";
          });

        document.getElementById("checkin").addEventListener("submit", function (e) {
          e.preventDefault();
          var who = (input.value || "").trim().toLowerCase().replace(/\s+/g, "-");
          if (!/^[a-z0-9_-]{2,32}$/.test(who)) {
            note.textContent = "Use 2–32 letters, numbers, or dashes.";
            return;
          }
          Promise.all([bump("from-" + who), ping(who)])
            .then(function () {
              note.textContent = "Checked in as " + who + ".";
            })
            .catch(function () {
              note.textContent = "Could not check in. Try again.";
            });
        });
      })();
    </script>
  </body>
</html>
